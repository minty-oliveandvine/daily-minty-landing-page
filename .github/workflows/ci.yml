# Types, lint, a production build and the browser specs. The workflow body is shared:
# minty-oliveandvine/.github -> .github/workflows/next-web.yml
#
# This is the one repo whose playwright.config.ts starts its own server and needs no backend and
# no database, so its specs run here rather than in Minty's stack job. contact.spec.ts never
# sends a valid message, so no mail leaves CI.
#
# On the main / development convention since 2026-10-09, like every other repo: `master` was
# renamed to `main` on GitHub (so the old trigger matched no ref at all) and `development` now
# carries the work. `Newlandingpages` stays until main is fast-forwarded onto it, then goes.
name: ci

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    uses: minty-oliveandvine/.github/.github/workflows/next-web.yml@v1
    with:
      typecheck-script: type-check
      unit-tests: false
      e2e: true
